<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <!-- Minimalist Black Squircle Background -->
  <rect width="32" height="32" rx="8" fill="#09090b" />
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />

  <!-- Clean Peace Oracle Hand Sign (White Line Art) -->
  <g stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Index Finger (Raised) -->
    <path d="M12.5 16V8a1.5 1.5 0 0 1 3 0v7" />
    <!-- Middle Finger (Raised) -->
    <path d="M15.5 15V6a1.5 1.5 0 0 1 3 0v9" />
    <!-- Folded Ring & Pinky Fingers -->
    <path d="M18.5 13a1.5 1.5 0 0 1 3 0v3.5a4.5 4.5 0 0 1-4.5 4.5h-1.5" />
    <!-- Folded Thumb & Palm Base -->
    <path d="M12.5 14a1.5 1.5 0 0 0-3 0v3.5a6 6 0 0 0 6 6h2a4.5 4.5 0 0 0 4.5-4.5" />
    <!-- Wrist Base -->
    <path d="M13.5 24v2M18.5 24v2" stroke-width="1.4" stroke-opacity="0.5" />
  </g>
</svg>